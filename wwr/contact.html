<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | Contact Us | Down The River - Gad Cerda</title>
    <meta name="description"
      content="Get in touch with Down The River company. Send us your questions about rafting trips, general inquiries, or website suggestions.">
    <meta name="author" content="Gad Cerda Lara">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="logo-box">
            <img src="images/profile.jpg" alt="Logo Down The River">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 style="text-align: center;">Down The River Company</h1>


        <div class="contact-details-header">
            <p>123 Main River Street</p>
            <p> Address: 123 River Road, Salomon, Washinton State</p>
            <p>Phone: +1 (868) 307-1879</p>
            <p>Email: infobydownriver@gmail.com</p>
        </div>


        <div class="contact-main-container">

            <!-- Column Izquierda: Map -->
            <div class="map-container">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d51330509.49755986!2d-171.3269298880142!3d38.25710229863081!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x54961322bfd776df%3A0x73775060d8b07351!2sWet%20Planet%20Rafting%20and%20Kayaking!5e0!3m2!1ses!2smx!4v1785538827225!5m2!1ses!2smx"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <!-- Columna Derecha: Formulary -->
            <div class="form-section">
                <form action="#" method="post">

                    <div class="form-item-row">
                        <label for="name">Name:</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder" required>
                    </div>

                    <div class="form-item-row">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder"
                          required>
                    </div>

                    <fieldset class="form-item-radio">
                        <legend>Message Purpose:</legend>

                        <div class="radio-option">
                            <input type="radio" id="general" name="purpose" value="general" checked>
                            <label for="general">General Inquiry</label>
                        </div>

                        <div class="radio-option">
                            <input type="radio" id="booking" name="purpose" value="booking">
                            <label for="booking">Reservation Question</label>
                        </div>

                        <div class="radio-option">
                            <input type="radio" id="suggestion" name="purpose" value="suggestion">
                            <label for="suggestion">Website Suggestion</label>
                        </div>
                    </fieldset>

                    <div class="form-item-message">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="4" placeholder="Type here"
                          required></textarea>
                    </div>

                    <div class="form-item-checkbox">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        <label for="newsletter">Please Subscribe me to the monthly
                            newsletter</label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </form>
            </div>

        </div> <!-- FIN de .contact-main-container -->

        <!-- Sección de Empleados -->
        <section class="employees-section">
            <h2>We Are Here to Serve You!</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/Arturo_portillo.jpg" alt="Lead Guide">
                    <figcaption>Lead Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/Sarah_warburton.jpg" alt="Customer support">
                    <figcaption>Customer Support</figcaption>
                </figure>
                <figure>
                    <img src="images/Joan_smith.jpg" alt="Safety Instructor">
                    <figcaption>safety instructor</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026, Down The River, Gad Cerda Lara</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" class="logo-menu"
                  alt="logo of facebook"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.svg" class="logo-menu"
                  alt="logo of linkedin"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg" class="logo-menu"
                  alt="logo of instagram"></a>
        </nav>
    </footer>
</body>

</html>
